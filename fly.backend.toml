# Backend (FastAPI) on Fly.io. Build context is the repo root (needs data/processed).
#   fly deploy -c fly.backend.toml
# Set secrets first:
#   fly secrets set DATABASE_URL=... GOOGLE_API_KEY=... AUTH_JWT_SECRET=... \
#     CORS_ORIGINS='["https://<frontend-app>.fly.dev"]' \
#     LANGFUSE_PUBLIC_KEY=... LANGFUSE_SECRET_KEY=... LANGFUSE_HOST=... -a <backend-app>
app = "inventory-copilot-backend"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[deploy]
  # Apply DB migrations to Neon before the new version serves traffic.
  release_command = "alembic upgrade head"

[env]
  DATA_DIR = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/health"
    interval = "15s"
    timeout = "2s"

[[vm]]
  # The API loads the dataset into memory at startup; bump if warm-up gets killed.
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
