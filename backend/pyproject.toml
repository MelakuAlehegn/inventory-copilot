[project]
name = "inventory-copilot"
version = "0.1.0"
description = "Deterministic demand/inventory core + grounded LLM agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # --- deterministic core ---
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "lightgbm>=4.3",
    "mlforecast>=0.13",
    "utilsforecast>=0.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "mlflow>=2.14",
    # --- api ---
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    # --- agent / llm ---
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "openai>=1.40",            # OpenAI-compatible client for Ollama + Groq
    # --- observability ---
    "langfuse>=2.0",
    "logfire>=0.50",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
