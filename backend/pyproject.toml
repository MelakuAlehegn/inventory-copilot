[project]
name = "inventory-copilot"
version = "0.1.0"
description = "Deterministic demand/inventory core + grounded LLM agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "pandas>=2.2",             # required by datasetsforecast / mlforecast
    "numpy>=1.26",
    "scipy>=1.13",
    "datasetsforecast>=0.0.8", # public M5 loader (no Kaggle auth needed)
    "lightgbm>=4.3",
    "mlforecast>=0.13",
    "utilsforecast>=0.2",
    "mlflow>=2.14",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# HTTP API
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "httpx>=0.27",
    "sse-starlette>=2.1",
]
# Agent + LLM
agent = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",  # Gemini chat model + native function calling
    "langfuse>=2.0",
    "logfire>=0.50",
]
# MCP server (optional)
mcp = ["mcp>=1.0"]
# Plotting / reporting
viz = ["matplotlib>=3.8"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
copilot-chat = "copilot.agent.cli:main"
copilot-eval = "copilot.eval.__main__:main"
copilot-eval-forecast = "copilot.eval.forecast:main"
copilot-eval-backtest = "copilot.eval.backtest:main"
copilot-eval-decision = "copilot.eval.decision:main"
copilot-eval-agent = "copilot.eval.agent:main"
copilot-judge-test = "copilot.eval.judge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
