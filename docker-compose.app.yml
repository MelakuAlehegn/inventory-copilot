# Run the full stack:  docker compose -f docker-compose.app.yml up --build
# Secrets are read from a root .env (see .env.example).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://copilot:copilot@postgres:5432/copilot
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000  # baked into the browser bundle at build
    environment:
      API_BASE_URL: http://backend:8000  # server-side calls reach the backend by service name
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
