# Frontend (Next.js) on Fly.io. Build context is frontend/.
#   fly deploy -c frontend/fly.toml
# NEXT_PUBLIC_API_URL is baked at build (below); the rest are runtime secrets:
#   fly secrets set AUTH_SECRET=... AUTH_JWT_SECRET=... AUTH_GOOGLE_ID=... \
#     AUTH_GOOGLE_SECRET=... AUTH_URL=https://<frontend-app>.fly.dev \
#     API_BASE_URL=https://<backend-app>.fly.dev AUTH_TRUST_HOST=true \
#     SERVER_ACTION_ORIGINS=<frontend-app>.fly.dev -a <frontend-app>
app = "inventory-copilot-frontend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    # The browser calls the backend at this url; set it to your deployed backend.
    NEXT_PUBLIC_API_URL = "https://inventory-copilot-backend.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
